[project]
name = "collections-voicebot"
version = "0.1.0"
description = "Mumbai Bank outbound collections voicebot — GreyLabs AI PM take-home"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pipecat-ai[sarvam,deepgram,anthropic,openai,webrtc,silero,runner,rnnoise]>=1.16.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["bot", "eval"]
